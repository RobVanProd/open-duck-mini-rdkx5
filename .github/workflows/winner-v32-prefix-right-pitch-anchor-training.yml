name: Winner v32 prefix right pitch anchor training

on:
  push:
    branches:
      - codex/winner-v4-response-contract
    paths:
      - outputs/analysis/winner_v32_prefix_right_pitch_anchor_training_preregistration.json
      - outputs/analysis/WINNER_V32_PREFIX_RIGHT_PITCH_ANCHOR_TRAINING_PREREGISTRATION_20260722.md

permissions:
  actions: read
  contents: read

concurrency:
  group: winner-v32-prefix-right-pitch-anchor-training
  cancel-in-progress: false

jobs:
  training:
    name: One frozen 100-update prefix-anchor arm
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Reject workflow reruns
        run: test "${{ github.run_attempt }}" = "1"

      - name: Checkout frozen training arm
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install exact CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jax[cpu]==0.7.2" \
            "jaxlib==0.7.2" \
            "mujoco==3.9.0" \
            "numpy==2.0.2" \
            "onnx==1.22.0" \
            "onnxruntime==1.27.0" \
            "pytest==8.4.2"

      - name: Verify frozen training package
        run: |
          python -m pytest -q \
            tests/test_winner_v24_symmetric_support_failure_v2.py \
            tests/test_winner_v24_symmetric_support_failure_v3.py \
            tests/test_winner_v29_prefix_right_pitch_anchor.py \
            tests/test_winner_v32_prefix_right_pitch_anchor_training.py \
            tests/test_winner_v32_prefix_right_pitch_anchor_training_preregistration.py \
            tests/test_winner_v32_prefix_right_pitch_anchor_training_import.py

      - name: Resolve exact imported source artifacts
        id: sources
        shell: bash
        run: |
          python - <<'PY' >>"$GITHUB_OUTPUT"
          import hashlib
          import json
          from pathlib import Path

          value = json.loads(Path("outputs/analysis/winner_v32_prefix_right_pitch_anchor_training_preregistration.json").read_text())
          if value["status"] != "PREREGISTERED_WINNER_V32_PREFIX_RIGHT_PITCH_ANCHOR_TRAINING":
              raise SystemExit("Winner-v32 training is not preregistered")
          sources = value["sources"]
          for name, item in sources.items():
              observed = hashlib.sha256(Path(item["path"]).read_bytes().replace(b"\r\n", b"\n")).hexdigest()
              if item["hash_mode"] != "lf" or observed != item["sha256"]:
                  raise SystemExit(f"Winner-v32 training source changed: {name}")
          canonical = hashlib.sha256(json.dumps(sources, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          if canonical != value["source_manifest_sha256"]:
              raise SystemExit("Winner-v32 training source manifest changed")
          for prefix, key in (("source", "source_checkpoint"), ("teacher", "teacher_checkpoint")):
              attribution = value[key]["repository_attribution"]
              if attribution["repository"] != "RobVanProd/open-duck-mini-rdkx5" or attribution["github_run_attempt"] != 1:
                  raise SystemExit(f"Winner-v32 {prefix} attribution changed")
              print(f"{prefix}_run_id={attribution['github_run_id']}")
              print(f"{prefix}_artifact_name={attribution['github_artifact_name']}")
          PY

      - name: Download exact preserved Winner-v30 source artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.sources.outputs.source_artifact_name }}
          path: /tmp/winner-v30-source
          repository: RobVanProd/open-duck-mini-rdkx5
          run-id: ${{ steps.sources.outputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Download exact Winner-v22 teacher artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.sources.outputs.teacher_artifact_name }}
          path: /tmp/winner-v22-teacher
          repository: RobVanProd/open-duck-mini-rdkx5
          run-id: ${{ steps.sources.outputs.teacher_run_id }}
          github-token: ${{ github.token }}

      - name: Verify exact source and teacher snapshots
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          value = json.loads(Path("outputs/analysis/winner_v32_prefix_right_pitch_anchor_training_preregistration.json").read_text())
          items = (
              (
                  value["source_checkpoint"]["snapshot"],
                  Path("/tmp/winner-v30-source/winner-v30-prefix-anchor-work/winner_v30_prefix_right_pitch_anchor_update_201.npz"),
              ),
              (
                  value["teacher_checkpoint"]["snapshot"],
                  Path("/tmp/winner-v22-teacher/winner-v22-normalized-predictor-training-work/snapshots/snapshot_normalized_predictor_update_100.npz"),
              ),
          )
          for receipt, path in items:
              if hashlib.sha256(path.read_bytes()).hexdigest() != receipt["sha256"] or path.stat().st_size != receipt["bytes"]:
                  raise SystemExit(f"Winner-v32 snapshot changed: {path}")
          PY

      - name: Prepare exact reviewed simulation environment
        run: |
          git clone --quiet https://github.com/RobVanProd/Open_Duck_Playground.git /tmp/playground-source
          python tools/prepare_winner_v15_cpu_environment.py \
            --source-repository /tmp/playground-source \
            --output-root /tmp/pg115-v32-training \
            --work-root /tmp/winner-v32-training-environment \
            --fit-output /tmp/fixed_target_p30_actuator_fit_lf.json

      - name: Run exactly one 100-update prefix-anchor arm
        run: |
          python tools/run_winner_v32_prefix_right_pitch_anchor_training.py \
            --playground-root /tmp/pg115-v32-training \
            --canonical-fit /tmp/fixed_target_p30_actuator_fit_lf.json \
            --source-snapshot /tmp/winner-v30-source/winner-v30-prefix-anchor-work/winner_v30_prefix_right_pitch_anchor_update_201.npz \
            --teacher-snapshot /tmp/winner-v22-teacher/winner-v22-normalized-predictor-training-work/snapshots/snapshot_normalized_predictor_update_100.npz \
            --work-root /tmp/winner-v32-prefix-anchor-training-work \
            --output /tmp/winner-v32-prefix-right-pitch-anchor-training-result.json \
            --offline-cpu-only \
            --prefix-anchor-training-authorized

      - name: Hash training result
        if: always()
        run: |
          result=/tmp/winner-v32-prefix-right-pitch-anchor-training-result.json
          if test -f "$result"; then
            sha256sum "$result" | tee /tmp/winner-v32-prefix-right-pitch-anchor-training-result.sha256
          fi

      - name: Upload only training evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winner-v32-prefix-right-pitch-anchor-training-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          path: |
            /tmp/winner-v32-prefix-right-pitch-anchor-training-result.json
            /tmp/winner-v32-prefix-right-pitch-anchor-training-result.sha256
            /tmp/winner-v32-prefix-anchor-training-work
