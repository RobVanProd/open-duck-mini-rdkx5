name: Winner v13 support-controller CPU contract

on:
  push:
    branches:
      - codex/winner-v4-response-contract
    paths:
      - outputs/analysis/winner_v13_support_controller_cpu_contract.json
      - outputs/analysis/WINNER_V13_SUPPORT_CONTROLLER_CPU_CONTRACT_20260721.md

permissions:
  actions: read
  contents: read

concurrency:
  group: winner-v13-support-controller-cpu-contract
  cancel-in-progress: false

jobs:
  cpu-contract:
    name: One restored-snapshot Stage-2 CPU update
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Reject workflow reruns
        run: test "${{ github.run_attempt }}" = "1"

      - name: Checkout frozen contract
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install exact CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jax[cpu]==0.7.2" \
            "jaxlib==0.7.2" \
            "mujoco==3.9.0" \
            "numpy==2.0.2" \
            "onnx==1.22.0" \
            "onnxruntime==1.27.0" \
            "pytest==8.4.2"

      - name: Verify frozen support CPU package
        run: |
          python -m pytest -q \
            tests/test_winner_v13_support_controller_cpu_contract.py

      - name: Recover exact passing Stage-1 final snapshot
        run: |
          gh api \
            repos/RobVanProd/open-duck-mini-rdkx5/actions/artifacts/8492593761/zip \
            > /tmp/winner-v13-stage1-v2.zip
          echo 'b3ff19186ef39e8a72f9e43095d373840fb0b1562a2f7bed83a74c9f10cf6680  /tmp/winner-v13-stage1-v2.zip' \
            | sha256sum --check
          python - <<'PY'
          import hashlib
          from pathlib import Path, PurePosixPath
          import stat
          import zipfile

          archive_path = Path("/tmp/winner-v13-stage1-v2.zip")
          target_name = (
              "winner-v13-normalized-response-stage1-v2-work/snapshots/"
              "snapshot_stage1_update_100.npz"
          )
          with zipfile.ZipFile(archive_path) as archive:
              infos = archive.infolist()
              names = [item.filename for item in infos]
              if len(names) != len(set(names)) or target_name not in names:
                  raise SystemExit("Stage-1 artifact inventory is invalid")
              for info in infos:
                  member = PurePosixPath(info.filename)
                  file_type = stat.S_IFMT(info.external_attr >> 16)
                  if (
                      member.is_absolute()
                      or ".." in member.parts
                      or "." in member.parts
                      or "\\" in info.filename
                      or info.flag_bits & 1
                      or info.is_dir()
                      or file_type == stat.S_IFLNK
                      or file_type not in {0, stat.S_IFREG}
                  ):
                      raise SystemExit("Stage-1 artifact has unsafe member")
              payload = archive.read(target_name)
          expected = "8c1392c738eddfb098e61c1a6ae2f863eda883e1eba6ac546aef695da6f163af"
          if len(payload) != 189027 or hashlib.sha256(payload).hexdigest() != expected:
              raise SystemExit("Stage-1 final snapshot changed")
          Path("/tmp/winner-v13-stage1-final.npz").write_bytes(payload)
          PY

      - name: Compose exact 115-D Playground
        run: |
          git clone --quiet https://github.com/RobVanProd/Open_Duck_Playground.git \
            /tmp/playground-source
          python tools/compose_winner_v7_playground.py \
            --source-repository /tmp/playground-source \
            --output-root /tmp/pg115-v13-support-cpu
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("/tmp/pg115-v13-support-cpu")
          for name in (
              "playground/common/phase_moe_networks.py",
              "playground/common/recurrent_ppo_networks.py",
              "playground/common/rewards.py",
              "playground/common/runner.py",
              "playground/open_duck_mini_v2/custom_rewards.py",
              "playground/open_duck_mini_v2/joystick.py",
              "playground/open_duck_mini_v2/runner.py",
              "playground/open_duck_mini_v2/xmls/open_duck_mini_v2_backlash.xml",
              "playground/open_duck_mini_v2/xmls/scene_flat_terrain_backlash.xml",
          ):
              path = root / name
              data = path.read_bytes().replace(b"\r\n", b"\n")
              path.write_bytes(data.replace(b"\n", b"\r\n"))
          receipt_path = root / "winner_v7_playground_composition_receipt.json"
          receipt = json.loads(receipt_path.read_text())
          receipt["composed_file_hashes"] = {
              relative: hashlib.sha256((root / relative).read_bytes()).hexdigest()
              for relative in sorted(receipt["composed_file_hashes"])
          }
          receipt_bytes = (json.dumps(receipt, indent=2, sort_keys=True) + "\n").encode()
          receipt_path.write_bytes(receipt_bytes)
          expected = "628c35fab95e41a2fa82ae2255e0109502d72632c7ad408bf7e1294f5eb1c196"
          if hashlib.sha256(receipt_bytes).hexdigest() != expected:
              raise SystemExit("composition receipt reconstruction mismatch")
          PY

      - name: Reconstruct reviewed Windows-origin evidence bytes
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in (
              "outputs/analysis/winner_v6b_numeric_hold_attribution.json",
              "outputs/analysis/winner_v8_numeric_hold_attribution.json",
              "outputs/analysis/winner_v9_stored_bound_contract_result.json",
              "outputs/analysis/winner_v9_nominal_behavior_result.json",
              "outputs/analysis/winner_v9_numeric_torque_hold_attribution.json",
              "outputs/analysis/winner_v10_inward_torque_contract_result.json",
              "outputs/analysis/winner_v10_nominal_behavior_result.json",
              "outputs/analysis/winner_v10_r2_condition1_result.json",
              "outputs/analysis/winner_v10_r2_condition2_result.json",
              "outputs/analysis/winner_v10_r2_condition3_result.json",
              "outputs/analysis/winner_v10_r2_condition4_result.json",
              "outputs/analysis/winner_v10_r2_condition5_result.json",
              "outputs/analysis/winner_v10_r2_condition6_result.json",
              "outputs/analysis/ground_up_robustness_r2_matrix_preregistration.json",
              "outputs/analysis/ground_up_robustness_r2_evaluator_contract.json",
              "outputs/analysis/ground_up_robustness_r2_reporting_contract.json",
              "outputs/analysis/fixed_target_p30_actuator_fit_20260712.json",
              "outputs/analysis/fixed_target_p31_34_actuator_fit_20260712.json",
              "tools/evaluate_ground_up_policy.py",
              "tools/closed_loop_sim_eval.py",
              "tools/actuator_bridge_model.py",
              "tools/aggregate_ground_up_robustness_r1.py",
          ):
              path = Path(name)
              data = path.read_bytes().replace(b"\r\n", b"\n")
              path.write_bytes(data.replace(b"\n", b"\r\n"))
          PY

      - name: Reconstruct exact Winner-v10 XML
        run: |
          python tools/run_winner_v7_inward_projection_contract.py \
            --work-root /tmp/winner-v7 \
            --output /tmp/winner-v7-contract.json
          python tools/run_winner_v9_stored_bound_contract.py \
            --source-half /tmp/winner-v7/winner_v7_half_inward_projection.onnx \
            --source-final /tmp/winner-v7/winner_v7_final_inward_projection.onnx \
            --model-xml /tmp/pg115-v13-support-cpu/playground/open_duck_mini_v2/xmls/open_duck_mini_v2_backlash.xml \
            --scene-xml /tmp/pg115-v13-support-cpu/playground/open_duck_mini_v2/xmls/scene_flat_terrain_backlash.xml \
            --work-root /tmp/winner-v9 \
            --output /tmp/winner-v9-contract.json
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          path = Path("/tmp/winner-v9/xmls/open_duck_mini_v2_backlash.xml")
          data = path.read_bytes().replace(b"\r\n", b"\n")
          path.write_bytes(data.replace(b"\n", b"\r\n"))
          if sha256(path.read_bytes()).hexdigest() != "2132e477d2504faf08af4c5250952bd8b17611fb496ab15f30afc0371f327f9c":
              raise SystemExit("winner-v9 XML reconstruction mismatch")
          PY
          python tools/run_winner_v10_inward_torque_contract.py \
            --source-half /tmp/winner-v9/winner_v9_half_stored_bound.onnx \
            --source-final /tmp/winner-v9/winner_v9_final_stored_bound.onnx \
            --source-model-xml /tmp/winner-v9/xmls/open_duck_mini_v2_backlash.xml \
            --source-scene-xml /tmp/winner-v9/xmls/scene_flat_terrain_backlash.xml \
            --work-root /tmp/winner-v10 \
            --output /tmp/winner-v10-contract.json

      - name: Restore exact composed tree and canonical LF fit
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          root = Path("/tmp/pg115-v13-support-cpu")
          receipt = json.loads(
              (root / "winner_v7_playground_composition_receipt.json").read_text()
          )
          composed = receipt["composed_file_hashes"]
          for relative, expected in composed.items():
              if hashlib.sha256((root / relative).read_bytes()).hexdigest() != expected:
                  raise SystemExit(f"composed file reconstruction mismatch: {relative}")
          allowed = set(composed) | {"winner_v7_playground_composition_receipt.json"}
          status = subprocess.check_output(
              ["git", "status", "--porcelain=v1"], cwd=root, text=True
          ).splitlines()
          for line in status:
              relative = line[3:].replace("\\", "/")
              if relative not in allowed:
                  subprocess.run(
                      ["git", "restore", "--source=HEAD", "--worktree", "--", relative],
                      cwd=root,
                      check=True,
                  )
          fit_source = Path("outputs/analysis/fixed_target_p30_actuator_fit_20260712.json")
          fit_target = Path("/tmp/fixed_target_p30_actuator_fit_lf.json")
          fit_target.write_bytes(fit_source.read_bytes().replace(b"\r\n", b"\n"))
          if hashlib.sha256(fit_target.read_bytes()).hexdigest() != "908ddb01e5d82e661d77b8f3cb186a84665695660b86b304c6d1ae89c79cdb0b":
              raise SystemExit("canonical LF fit reconstruction mismatch")
          PY
          cp /tmp/winner-v10/xmls/open_duck_mini_v2_backlash.xml \
            /tmp/pg115-v13-support-cpu/playground/open_duck_mini_v2/xmls/open_duck_mini_v2_backlash.xml
          cp /tmp/winner-v10/xmls/scene_flat_terrain_backlash.xml \
            /tmp/pg115-v13-support-cpu/playground/open_duck_mini_v2/xmls/scene_flat_terrain_backlash.xml

      - name: Run exactly one restored-snapshot Stage-2 update
        run: |
          python tools/run_winner_v13_support_controller_cpu_contract.py \
            --playground-root /tmp/pg115-v13-support-cpu \
            --canonical-fit /tmp/fixed_target_p30_actuator_fit_lf.json \
            --stage1-final-snapshot /tmp/winner-v13-stage1-final.npz \
            --work-root /tmp/winner-v13-support-controller-cpu-work \
            --output /tmp/winner-v13-support-controller-cpu-result.json \
            --offline-cpu-only \
            --one-update-support-contract-authorized

      - name: Hash support CPU result
        if: always()
        run: |
          if test -f /tmp/winner-v13-support-controller-cpu-result.json; then
            sha256sum /tmp/winner-v13-support-controller-cpu-result.json \
              | tee /tmp/winner-v13-support-controller-cpu-result.sha256
          fi

      - name: Upload only support CPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winner-v13-support-controller-cpu-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          path: |
            /tmp/winner-v13-support-controller-cpu-result.json
            /tmp/winner-v13-support-controller-cpu-result.sha256
            /tmp/winner-v13-support-controller-cpu-work
