name: Winner v17 support action-combination diagnostic

on:
  push:
    branches:
      - codex/winner-v4-response-contract
    paths:
      - outputs/analysis/winner_v17_support_action_combination_diagnostic_preregistration.json
      - outputs/analysis/WINNER_V17_SUPPORT_ACTION_COMBINATION_DIAGNOSTIC_PREREGISTRATION_20260721.md

permissions:
  actions: read
  contents: read

concurrency:
  group: winner-v17-support-action-combination-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    name: One CPU-only sign-consistent combination screen
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Reject workflow reruns
        run: test "${{ github.run_attempt }}" = "1"

      - name: Checkout frozen diagnostic
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install exact CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jax[cpu]==0.7.2" \
            "jaxlib==0.7.2" \
            "mujoco==3.9.0" \
            "numpy==2.0.2" \
            "onnx==1.22.0" \
            "onnxruntime==1.27.0" \
            "pytest==8.4.2"

      - name: Verify frozen diagnostic package
        run: |
          python -m pytest -q \
            tests/test_winner_v17_support_action_combination.py \
            tests/test_winner_v17_support_action_combination_diagnostic.py \
            tests/test_winner_v17_support_action_combination_diagnostic_preregistration.py \
            tests/test_winner_v16_support_action_direction_hold_attribution.py

      - name: Resolve exact training artifact
        id: training
        shell: bash
        run: |
          python - <<'PY' >>"$GITHUB_OUTPUT"
          import hashlib
          import json
          from pathlib import Path

          value = json.loads(
              Path("outputs/analysis/winner_v17_support_action_combination_diagnostic_preregistration.json").read_text()
          )
          if value["status"] != "PREREGISTERED_WINNER_V17_SUPPORT_ACTION_COMBINATION_DIAGNOSTIC":
              raise SystemExit("combination diagnostic is not preregistered")
          for name, item in value["sources"].items():
              observed = hashlib.sha256(
                  Path(item["path"]).read_bytes().replace(b"\r\n", b"\n")
              ).hexdigest()
              if item["hash_mode"] != "lf" or observed != item["sha256"]:
                  raise SystemExit(f"combination source changed: {name}")
          canonical = hashlib.sha256(
              json.dumps(value["sources"], sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          if canonical != value["source_manifest_sha256"]:
              raise SystemExit("combination source manifest changed")
          attribution = value["training_artifact"]["repository_attribution"]
          if attribution["repository"] != "RobVanProd/open-duck-mini-rdkx5" or attribution["github_run_attempt"] != 1:
              raise SystemExit("training artifact attribution changed")
          print(f"run_id={attribution['github_run_id']}")
          print(f"artifact_name={attribution['github_artifact_name']}")
          PY

      - name: Download exact verified training artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.training.outputs.artifact_name }}
          path: /tmp/winner-v15-training-artifact
          repository: RobVanProd/open-duck-mini-rdkx5
          run-id: ${{ steps.training.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Prepare exact reviewed simulation environment
        run: |
          git clone --quiet https://github.com/RobVanProd/Open_Duck_Playground.git \
            /tmp/playground-source
          python tools/prepare_winner_v15_cpu_environment.py \
            --source-repository /tmp/playground-source \
            --output-root /tmp/pg115-v17-combination \
            --work-root /tmp/winner-v17-combination-environment \
            --fit-output /tmp/fixed_target_p30_actuator_fit_lf.json

      - name: Run one frozen combination diagnostic
        run: |
          python tools/run_winner_v17_support_action_combination_diagnostic.py \
            --training-work-root /tmp/winner-v15-training-artifact/winner-v15-pitch-margin-training-work \
            --playground-root /tmp/pg115-v17-combination \
            --canonical-fit /tmp/fixed_target_p30_actuator_fit_lf.json \
            --output /tmp/winner-v17-support-action-combination-result.json \
            --offline-cpu-only \
            --direction-diagnostic-authorized

      - name: Hash diagnostic result
        if: always()
        run: |
          result=/tmp/winner-v17-support-action-combination-result.json
          if test -f "$result"; then
            sha256sum "$result" | tee /tmp/winner-v17-support-action-combination-result.sha256
          fi

      - name: Upload only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winner-v17-support-action-combination-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          path: |
            /tmp/winner-v17-support-action-combination-result.json
            /tmp/winner-v17-support-action-combination-result.sha256
