name: Winner v31 cross worker replay attribution

on:
  push:
    branches:
      - codex/winner-v4-response-contract
    paths:
      - outputs/analysis/winner_v31_cross_worker_replay_attribution_preregistration.json
      - outputs/analysis/WINNER_V31_CROSS_WORKER_REPLAY_ATTRIBUTION_PREREGISTRATION_20260722.md

permissions:
  contents: read

concurrency:
  group: winner-v31-cross-worker-replay-attribution
  cancel-in-progress: false

jobs:
  attribution:
    name: Saved-result-only replay attribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reject workflow reruns
        run: test "${{ github.run_attempt }}" = "1"
      - name: Checkout frozen attribution
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install exact test runner
        run: python -m pip install "pytest==8.4.2"
      - name: Verify frozen attribution package
        run: |
          python -m pytest -q \
            tests/test_winner_v31_cross_worker_replay_attribution.py \
            tests/test_winner_v31_cross_worker_replay_attribution_preregistration.py \
            tests/test_winner_v31_cross_worker_replay_attribution_import.py
      - name: Run one saved-result-only attribution
        run: |
          python tools/run_winner_v31_cross_worker_replay_attribution.py \
            --output /tmp/winner-v31-cross-worker-replay-attribution-result.json \
            --saved-result-only-attribution-authorized
      - name: Hash attribution result
        if: always()
        run: |
          result=/tmp/winner-v31-cross-worker-replay-attribution-result.json
          if test -f "$result"; then
            sha256sum "$result" | tee /tmp/winner-v31-cross-worker-replay-attribution-result.sha256
          fi
      - name: Upload only attribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winner-v31-cross-worker-replay-attribution-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          path: |
            /tmp/winner-v31-cross-worker-replay-attribution-result.json
            /tmp/winner-v31-cross-worker-replay-attribution-result.sha256
