name: Winner v12 calibrator artifact recovery

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: winner-v12-calibrator-artifact-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: One frozen zero-update CPU recovery
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout frozen recovery contract
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download immutable failed-smoke artifacts
        uses: actions/download-artifact@v4
        with:
          name: winner-v12-calibrator-cpu-smoke-29802206612
          path: /tmp/recovered-smoke
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 29802206612

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install exact CPU recovery environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jax[cpu]==0.7.2" \
            "jaxlib==0.7.2" \
            "mujoco==3.9.0" \
            "numpy==2.0.2" \
            "onnx==1.22.0" \
            "onnxruntime==1.27.0" \
            "pytest==8.4.2"

      - name: Verify frozen zero-update recovery contract
        run: |
          python tools/build_winner_v12_calibrator_artifact_recovery_contract.py
          git diff --exit-code -- \
            outputs/analysis/winner_v12_calibrator_artifact_recovery_contract.json \
            outputs/analysis/WINNER_V12_CALIBRATOR_ARTIFACT_RECOVERY_CONTRACT_20260721.md
          python -m pytest -q \
            tests/test_winner_v12_calibrator_artifact_recovery_contract.py \
            tests/test_winner_v12_calibrator_cpu_smoke_failure_attribution.py

      - name: Compose exact 115-D Playground
        run: |
          git clone --quiet https://github.com/RobVanProd/Open_Duck_Playground.git \
            /tmp/playground-source
          python tools/compose_winner_v7_playground.py \
            --source-repository /tmp/playground-source \
            --output-root /tmp/pg115-v12-recovery
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("/tmp/pg115-v12-recovery")
          for name in (
              "playground/common/phase_moe_networks.py",
              "playground/common/recurrent_ppo_networks.py",
              "playground/common/rewards.py",
              "playground/common/runner.py",
              "playground/open_duck_mini_v2/custom_rewards.py",
              "playground/open_duck_mini_v2/joystick.py",
              "playground/open_duck_mini_v2/runner.py",
              "playground/open_duck_mini_v2/xmls/open_duck_mini_v2_backlash.xml",
              "playground/open_duck_mini_v2/xmls/scene_flat_terrain_backlash.xml",
          ):
              path = root / name
              data = path.read_bytes().replace(b"\r\n", b"\n")
              path.write_bytes(data.replace(b"\n", b"\r\n"))
          receipt_path = root / "winner_v7_playground_composition_receipt.json"
          receipt = json.loads(receipt_path.read_text())
          receipt["composed_file_hashes"] = {
              relative: hashlib.sha256((root / relative).read_bytes()).hexdigest()
              for relative in sorted(receipt["composed_file_hashes"])
          }
          receipt_bytes = (
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          ).encode()
          receipt_path.write_bytes(receipt_bytes)
          expected = "628c35fab95e41a2fa82ae2255e0109502d72632c7ad408bf7e1294f5eb1c196"
          observed = hashlib.sha256(receipt_bytes).hexdigest()
          if observed != expected:
              raise SystemExit(f"composition receipt reconstruction mismatch: {observed}")
          PY

      - name: Reconstruct reviewed Windows-origin evidence bytes
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in (
              "outputs/analysis/winner_v6b_numeric_hold_attribution.json",
              "outputs/analysis/winner_v8_numeric_hold_attribution.json",
              "outputs/analysis/winner_v9_stored_bound_contract_result.json",
              "outputs/analysis/winner_v9_nominal_behavior_result.json",
              "outputs/analysis/winner_v9_numeric_torque_hold_attribution.json",
              "outputs/analysis/winner_v10_inward_torque_contract_result.json",
              "outputs/analysis/winner_v10_nominal_behavior_result.json",
              "outputs/analysis/winner_v10_r2_condition1_result.json",
              "outputs/analysis/winner_v10_r2_condition2_result.json",
              "outputs/analysis/winner_v10_r2_condition3_result.json",
              "outputs/analysis/winner_v10_r2_condition4_result.json",
              "outputs/analysis/winner_v10_r2_condition5_result.json",
              "outputs/analysis/winner_v10_r2_condition6_result.json",
              "outputs/analysis/ground_up_robustness_r2_matrix_preregistration.json",
              "outputs/analysis/ground_up_robustness_r2_evaluator_contract.json",
              "outputs/analysis/ground_up_robustness_r2_reporting_contract.json",
              "outputs/analysis/fixed_target_p30_actuator_fit_20260712.json",
              "outputs/analysis/fixed_target_p31_34_actuator_fit_20260712.json",
              "tools/evaluate_ground_up_policy.py",
              "tools/closed_loop_sim_eval.py",
              "tools/actuator_bridge_model.py",
              "tools/aggregate_ground_up_robustness_r1.py",
          ):
              path = Path(name)
              data = path.read_bytes().replace(b"\r\n", b"\n")
              path.write_bytes(data.replace(b"\n", b"\r\n"))
          PY

      - name: Reconstruct exact protected Winner-v10 policies and XML
        run: |
          python tools/run_winner_v7_inward_projection_contract.py \
            --work-root /tmp/winner-v7 \
            --output /tmp/winner-v7-contract.json
          python tools/run_winner_v9_stored_bound_contract.py \
            --source-half /tmp/winner-v7/winner_v7_half_inward_projection.onnx \
            --source-final /tmp/winner-v7/winner_v7_final_inward_projection.onnx \
            --model-xml /tmp/pg115-v12-recovery/playground/open_duck_mini_v2/xmls/open_duck_mini_v2_backlash.xml \
            --scene-xml /tmp/pg115-v12-recovery/playground/open_duck_mini_v2/xmls/scene_flat_terrain_backlash.xml \
            --work-root /tmp/winner-v9 \
            --output /tmp/winner-v9-contract.json
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          path = Path("/tmp/winner-v9/xmls/open_duck_mini_v2_backlash.xml")
          data = path.read_bytes().replace(b"\r\n", b"\n")
          path.write_bytes(data.replace(b"\n", b"\r\n"))
          expected = "2132e477d2504faf08af4c5250952bd8b17611fb496ab15f30afc0371f327f9c"
          observed = sha256(path.read_bytes()).hexdigest()
          if observed != expected:
              raise SystemExit(f"winner-v9 XML reconstruction mismatch: {observed}")
          PY
          python tools/run_winner_v10_inward_torque_contract.py \
            --source-half /tmp/winner-v9/winner_v9_half_stored_bound.onnx \
            --source-final /tmp/winner-v9/winner_v9_final_stored_bound.onnx \
            --source-model-xml /tmp/winner-v9/xmls/open_duck_mini_v2_backlash.xml \
            --source-scene-xml /tmp/winner-v9/xmls/scene_flat_terrain_backlash.xml \
            --work-root /tmp/winner-v10 \
            --output /tmp/winner-v10-contract.json

      - name: Restore exact composed tree and apply reviewed XML overrides
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          root = Path("/tmp/pg115-v12-recovery")
          receipt = json.loads(
              (root / "winner_v7_playground_composition_receipt.json").read_text()
          )
          composed = receipt["composed_file_hashes"]
          for relative, expected in composed.items():
              observed = hashlib.sha256((root / relative).read_bytes()).hexdigest()
              if observed != expected:
                  raise SystemExit(f"composed file reconstruction mismatch: {relative}")
          allowed = set(composed) | {"winner_v7_playground_composition_receipt.json"}
          status = subprocess.check_output(
              ["git", "status", "--porcelain=v1"], cwd=root, text=True
          ).splitlines()
          for line in status:
              relative = line[3:].replace("\\", "/")
              if relative not in allowed:
                  subprocess.run(
                      ["git", "restore", "--source=HEAD", "--worktree", "--", relative],
                      cwd=root,
                      check=True,
                  )
          PY
          cp /tmp/winner-v10/xmls/open_duck_mini_v2_backlash.xml \
            /tmp/pg115-v12-recovery/playground/open_duck_mini_v2/xmls/open_duck_mini_v2_backlash.xml
          cp /tmp/winner-v10/xmls/scene_flat_terrain_backlash.xml \
            /tmp/pg115-v12-recovery/playground/open_duck_mini_v2/xmls/scene_flat_terrain_backlash.xml

      - name: Run one frozen read-only recovery
        run: |
          python tools/run_winner_v12_calibrator_artifact_recovery.py \
            --playground-root /tmp/pg115-v12-recovery \
            --policy-half /tmp/winner-v10/winner_v10_half_inward_torque.onnx \
            --policy-final /tmp/winner-v10/winner_v10_final_inward_torque.onnx \
            --checkpoint /tmp/recovered-smoke/winner-v12-calibrator-smoke/winner_v12_calibrator_smoke_checkpoint.npz \
            --graph /tmp/recovered-smoke/winner-v12-calibrator-smoke/winner_v12_calibrator_after_smoke.onnx \
            --canonical-fit /tmp/recovered-smoke/winner-v12-calibrator-smoke/fixed_target_p30_actuator_fit_lf.json \
            --output /tmp/winner-v12-calibrator-artifact-recovery-result.json

      - name: Hash recovered evidence result
        if: always()
        run: |
          if test -f /tmp/winner-v12-calibrator-artifact-recovery-result.json; then
            sha256sum /tmp/winner-v12-calibrator-artifact-recovery-result.json \
              | tee /tmp/winner-v12-calibrator-artifact-recovery-result.sha256
          fi

      - name: Upload only recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winner-v12-calibrator-artifact-recovery-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            /tmp/winner-v12-calibrator-artifact-recovery-result.json
            /tmp/winner-v12-calibrator-artifact-recovery-result.sha256
