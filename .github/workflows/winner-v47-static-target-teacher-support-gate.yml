name: Winner v47 static target teacher support gate

on:
  push:
    branches:
      - codex/winner-v4-response-contract
    paths:
      - outputs/analysis/winner_v47_static_target_teacher_support_gate_preregistration.json
      - outputs/analysis/WINNER_V47_STATIC_TARGET_TEACHER_SUPPORT_GATE_PREREGISTRATION_20260722.md

permissions:
  actions: read
  contents: read

concurrency:
  group: winner-v47-static-target-teacher-support-gate
  cancel-in-progress: false

jobs:
  gate:
    name: One frozen Winner-v47 248-cell offline support gate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Reject workflow reruns
        run: test "${{ github.run_attempt }}" = "1"
      - name: Checkout frozen gate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install exact CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jax[cpu]==0.7.2" "jaxlib==0.7.2" "mujoco==3.9.0" \
            "numpy==2.0.2" "onnx==1.22.0" "onnxruntime==1.27.0" "pytest==8.4.2"
      - name: Verify frozen gate package
        run: |
          python -m pytest -q \
            tests/test_winner_v47_static_target_teacher_support_gate.py \
            tests/test_winner_v47_static_target_teacher_support_gate_preregistration.py \
            tests/test_winner_v47_static_target_teacher_support_gate_import.py \
            tests/test_winner_v22_normalized_support_gate.py
      - name: Resolve exact imported Winner-v46 artifact
        id: training
        shell: bash
        run: |
          python - <<'PY' >>"$GITHUB_OUTPUT"
          import hashlib,json
          from pathlib import Path
          value=json.loads(Path("outputs/analysis/winner_v47_static_target_teacher_support_gate_preregistration.json").read_text())
          if value["status"]!="PREREGISTERED_WINNER_V47_STATIC_TARGET_TEACHER_SUPPORT_GATE" or any(value["execution_now"].values()):
              raise SystemExit("Winner-v47 authority changed")
          sources=value["sources"]
          for name,item in sources.items():
              observed=hashlib.sha256(Path(item["path"]).read_bytes().replace(b"\r\n",b"\n")).hexdigest()
              if item["hash_mode"]!="lf" or observed!=item["sha256"]:
                  raise SystemExit(f"Winner-v47 source changed: {name}")
          canonical=hashlib.sha256(json.dumps(sources,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          if canonical!=value["source_manifest_sha256"]:
              raise SystemExit("Winner-v47 manifest changed")
          item=value["training_artifact"]["repository_attribution"]
          if item["repository"]!="RobVanProd/open-duck-mini-rdkx5" or item["github_run_attempt"]!=1:
              raise SystemExit("Winner-v47 training attribution changed")
          print(f"run_id={item['github_run_id']}")
          print(f"artifact_name={item['github_artifact_name']}")
          PY
      - name: Download exact Winner-v46 training artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.training.outputs.artifact_name }}
          path: /tmp/winner-v46-training-artifact
          repository: RobVanProd/open-duck-mini-rdkx5
          run-id: ${{ steps.training.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify extracted checkpoint identities
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          value=json.loads(Path("outputs/analysis/winner_v47_static_target_teacher_support_gate_preregistration.json").read_text())
          root=Path("/tmp/winner-v46-training-artifact/winner-v46-static-target-teacher-training-work")
          for label,update in (("half",302),("final",352)):
              expected=value["training_artifact"][label]
              paths={
                  "snapshot":root/"snapshots"/f"snapshot_static_target_teacher_update_{update:03d}.npz",
                  "graph":root/"graphs"/f"winner_v46_{label}.onnx",
              }
              for kind,path in paths.items():
                  receipt=expected[kind]
                  if hashlib.sha256(path.read_bytes()).hexdigest()!=receipt["sha256"] or path.stat().st_size!=receipt["bytes"]:
                      raise SystemExit(f"Winner-v47 {label} {kind} changed")
          PY
      - name: Prepare exact reviewed simulation environment
        run: |
          git clone --quiet https://github.com/RobVanProd/Open_Duck_Playground.git /tmp/playground-source
          python tools/prepare_winner_v15_cpu_environment.py \
            --source-repository /tmp/playground-source \
            --output-root /tmp/pg115-v47-support-gate \
            --work-root /tmp/winner-v47-gate-environment \
            --fit-output /tmp/fixed_target_p30_actuator_fit_lf.json
      - name: Run exactly one frozen Winner-v47 support gate
        run: |
          python tools/run_winner_v47_static_target_teacher_support_gate.py \
            --training-work-root /tmp/winner-v46-training-artifact/winner-v46-static-target-teacher-training-work \
            --playground-root /tmp/pg115-v47-support-gate \
            --canonical-fit /tmp/fixed_target_p30_actuator_fit_lf.json \
            --output /tmp/winner-v47-static-target-teacher-support-gate-result.json \
            --offline-cpu-only --formal-gate-authorized
      - name: Hash support-gate result
        if: always()
        run: |
          result=/tmp/winner-v47-static-target-teacher-support-gate-result.json
          if test -f "$result"; then
            sha256sum "$result" | tee /tmp/winner-v47-static-target-teacher-support-gate-result.sha256
          fi
      - name: Upload only support-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winner-v47-static-target-teacher-support-gate-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          path: |
            /tmp/winner-v47-static-target-teacher-support-gate-result.json
            /tmp/winner-v47-static-target-teacher-support-gate-result.sha256
