name: Winner v15 pitch-margin support gate

on:
  push:
    branches:
      - codex/winner-v4-response-contract
    paths:
      - outputs/analysis/winner_v15_pitch_margin_support_gate_preregistration.json
      - outputs/analysis/WINNER_V15_PITCH_MARGIN_SUPPORT_GATE_PREREGISTRATION_20260721.md

permissions:
  actions: read
  contents: read

concurrency:
  group: winner-v15-pitch-margin-support-gate
  cancel-in-progress: false

jobs:
  gate:
    name: One frozen unchanged 248-cell offline support gate
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Reject workflow reruns
        run: test "${{ github.run_attempt }}" = "1"

      - name: Checkout frozen gate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install exact CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jax[cpu]==0.7.2" \
            "jaxlib==0.7.2" \
            "mujoco==3.9.0" \
            "numpy==2.0.2" \
            "onnx==1.22.0" \
            "onnxruntime==1.27.0" \
            "pytest==8.4.2"

      - name: Verify frozen gate package
        run: |
          python -m pytest -q \
            tests/test_winner_v15_pitch_margin_support_gate.py \
            tests/test_winner_v15_pitch_margin_support_gate_preregistration.py

      - name: Resolve exact imported training artifact
        id: training
        shell: bash
        run: |
          python - <<'PY' >>"$GITHUB_OUTPUT"
          import hashlib
          import json
          from pathlib import Path

          path = Path("outputs/analysis/winner_v15_pitch_margin_support_gate_preregistration.json")
          value = json.loads(path.read_text())
          if value["status"] != "PREREGISTERED_WINNER_V15_PITCH_MARGIN_SUPPORT_GATE":
              raise SystemExit("support gate is not preregistered")
          if value["execution_now"] != {
              "formal_support_cells": 0,
              "heldout_repeat_cells": 0,
              "locomotion_steps": 0,
              "robot_or_rdk_access": 0,
          }:
              raise SystemExit("support gate authority changed")
          sources = value["sources"]
          for name, item in sources.items():
              observed = hashlib.sha256(
                  Path(item["path"]).read_bytes().replace(b"\r\n", b"\n")
              ).hexdigest()
              if item["hash_mode"] != "lf" or observed != item["sha256"]:
                  raise SystemExit(f"support-gate source changed: {name}")
          canonical = hashlib.sha256(
              json.dumps(sources, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          if canonical != value["source_manifest_sha256"]:
              raise SystemExit("support-gate source manifest changed")
          attribution = value["training_artifact"]["repository_attribution"]
          if attribution["repository"] != "RobVanProd/open-duck-mini-rdkx5":
              raise SystemExit("training artifact repository changed")
          if attribution["github_run_attempt"] != 1:
              raise SystemExit("training source run was retried")
          print(f"run_id={attribution['github_run_id']}")
          print(f"artifact_name={attribution['github_artifact_name']}")
          PY

      - name: Download exact verified training artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.training.outputs.artifact_name }}
          path: /tmp/winner-v15-training-artifact
          repository: RobVanProd/open-duck-mini-rdkx5
          run-id: ${{ steps.training.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify extracted checkpoint identities
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          value = json.loads(
              Path("outputs/analysis/winner_v15_pitch_margin_support_gate_preregistration.json").read_text()
          )
          root = Path(
              "/tmp/winner-v15-training-artifact/"
              "winner-v15-pitch-margin-training-work"
          )
          for label, update in (("half", 50), ("final", 100)):
              expected = value["training_artifact"][label]
              paths = {
                  "snapshot": root / "snapshots" / f"snapshot_stage2_update_{update:03d}.npz",
                  "graph": root / "graphs" / f"winner_v15_pitch_margin_{label}.onnx",
              }
              for kind, path in paths.items():
                  receipt = expected[kind]
                  observed = hashlib.sha256(path.read_bytes()).hexdigest()
                  if observed != receipt["sha256"] or path.stat().st_size != receipt["bytes"]:
                      raise SystemExit(f"{label} {kind} differs from imported artifact")
          PY

      - name: Prepare exact reviewed simulation environment
        run: |
          git clone --quiet https://github.com/RobVanProd/Open_Duck_Playground.git \
            /tmp/playground-source
          python tools/prepare_winner_v15_cpu_environment.py \
            --source-repository /tmp/playground-source \
            --output-root /tmp/pg115-v15-support-gate \
            --work-root /tmp/winner-v15-gate-environment \
            --fit-output /tmp/fixed_target_p30_actuator_fit_lf.json

      - name: Run exactly one frozen unchanged support gate
        run: |
          python tools/run_winner_v15_pitch_margin_support_gate.py \
            --training-work-root /tmp/winner-v15-training-artifact/winner-v15-pitch-margin-training-work \
            --playground-root /tmp/pg115-v15-support-gate \
            --canonical-fit /tmp/fixed_target_p30_actuator_fit_lf.json \
            --output /tmp/winner-v15-pitch-margin-support-gate-result.json \
            --offline-cpu-only \
            --formal-gate-authorized

      - name: Hash support-gate result
        if: always()
        run: |
          result=/tmp/winner-v15-pitch-margin-support-gate-result.json
          if test -f "$result"; then
            sha256sum "$result" \
              | tee /tmp/winner-v15-pitch-margin-support-gate-result.sha256
          fi

      - name: Upload only support-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winner-v15-pitch-margin-support-gate-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          path: |
            /tmp/winner-v15-pitch-margin-support-gate-result.json
            /tmp/winner-v15-pitch-margin-support-gate-result.sha256
