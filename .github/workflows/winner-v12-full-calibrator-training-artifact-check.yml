name: Winner v12 full calibrator training artifact check

# Dormant until the completed run's exact artifact metadata and hashes are frozen.

on:
  push:
    branches:
      - codex/winner-v4-response-contract
    paths:
      - outputs/analysis/winner_v12_full_calibrator_training_artifact_check_launch.json
      - outputs/analysis/WINNER_V12_FULL_CALIBRATOR_TRAINING_ARTIFACT_CHECK_LAUNCH_20260721.md

permissions:
  actions: read
  contents: read

concurrency:
  group: winner-v12-full-calibrator-training-artifact-check
  cancel-in-progress: false

jobs:
  verify:
    name: One independent raw-ZIP verification
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Reject workflow reruns
        run: test "${{ github.run_attempt }}" = "1"

      - name: Checkout frozen verifier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install exact CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jax[cpu]==0.7.2" \
            "jaxlib==0.7.2" \
            "mujoco==3.9.0" \
            "numpy==2.0.2" \
            "onnx==1.22.0" \
            "onnxruntime==1.27.0" \
            "pytest==8.4.2"

      - name: Verify prospective artifact-check package
        run: |
          python -m pytest -q \
            tests/test_winner_v12_full_calibrator_training_artifact_check.py \
            tests/test_winner_v12_full_calibrator_training_artifact_check_launch.py

      - name: Resolve frozen artifact-check launch
        id: launch
        shell: bash
        run: |
          python - <<'PY' >>"$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          launch = json.loads(
              Path(
                  "outputs/analysis/winner_v12_full_calibrator_training_artifact_check_launch.json"
              ).read_text()
          )
          if launch["status"] != (
              "PASS_WINNER_V12_FULL_CALIBRATOR_TRAINING_ARTIFACT_CHECK_LAUNCH_FROZEN"
          ):
              raise SystemExit("artifact-check launch did not pass")
          if launch["execution_now"] != {
              "artifact_verifications": 0,
              "formal_support_cells": 0,
              "locomotion_training_steps": 0,
              "robot_or_rdk_access": 0,
          }:
              raise SystemExit("artifact-check launch authority changed")
          provenance = launch["repository_attribution"]
          expected = launch["expected_hashes"]
          for key, value in {
              "run_id": provenance["github_run_id"],
              "run_attempt": provenance["github_run_attempt"],
              "run_head_sha": provenance["github_run_head_sha"],
              "artifact_id": provenance["github_artifact_id"],
              "artifact_name": provenance["github_artifact_name"],
              "artifact_digest": provenance["github_artifact_digest"],
              "zip_sha256": expected["artifact_zip_sha256"],
              "result_sha256": expected["training_result_sha256"],
          }.items():
              print(f"{key}={value}")
          PY

      - name: Download exact raw GitHub artifact ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_id="${{ steps.launch.outputs.artifact_id }}"
          gh api \
            "repos/RobVanProd/open-duck-mini-rdkx5/actions/artifacts/${artifact_id}/zip" \
            > /tmp/winner-v12-full-calibrator-training.zip
          observed=$(sha256sum /tmp/winner-v12-full-calibrator-training.zip | cut -d' ' -f1)
          test "$observed" = "${{ steps.launch.outputs.zip_sha256 }}"

      - name: Independently verify complete training artifact
        run: |
          python tools/check_winner_v12_full_calibrator_training_artifact.py \
            --artifact-zip /tmp/winner-v12-full-calibrator-training.zip \
            --extract-root /tmp/winner-v12-full-calibrator-training-extracted \
            --expected-zip-sha256 "${{ steps.launch.outputs.zip_sha256 }}" \
            --expected-result-sha256 "${{ steps.launch.outputs.result_sha256 }}" \
            --expected-github-run-id "${{ steps.launch.outputs.run_id }}" \
            --expected-github-run-attempt "${{ steps.launch.outputs.run_attempt }}" \
            --expected-github-run-head-sha "${{ steps.launch.outputs.run_head_sha }}" \
            --expected-github-artifact-id "${{ steps.launch.outputs.artifact_id }}" \
            --expected-github-artifact-name "${{ steps.launch.outputs.artifact_name }}" \
            --expected-github-artifact-digest "${{ steps.launch.outputs.artifact_digest }}" \
            --output /tmp/winner-v12-full-calibrator-training-artifact-check-result.json

      - name: Hash independent artifact-check result
        if: always()
        run: |
          result=/tmp/winner-v12-full-calibrator-training-artifact-check-result.json
          if test -f "$result"; then
            sha256sum "$result" \
              | tee /tmp/winner-v12-full-calibrator-training-artifact-check-result.sha256
          fi

      - name: Upload only artifact-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winner-v12-full-calibrator-training-artifact-check-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            /tmp/winner-v12-full-calibrator-training-artifact-check-result.json
            /tmp/winner-v12-full-calibrator-training-artifact-check-result.sha256
